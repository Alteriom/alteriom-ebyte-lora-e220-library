[platformio]
default_envs = native

[env]
monitor_speed = 9600

; Native environment for unit testing only. The tests compile the library's
; own LoRa_E220.cpp (test/library_source.cpp) on a minimal Arduino core for the
; host (test/native_shim/).
[env:native]
platform = native
test_framework = unity
build_flags = 
    -DUNIT_TEST
    -DARDUINO=10819
    -std=c++11
    -I./
    -I test/native_shim
lib_deps = 
    throwtheswitch/Unity@^2.5.2
lib_ignore = 
    # Ignore Arduino-specific libraries for native testing
    SoftwareSerial