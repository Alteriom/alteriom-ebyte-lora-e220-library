name: 📖 Wiki Integration

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/wiki-integration-guide.md'
      - 'docs/_sidebar.md'
      - 'docs/_navbar.md'
      - '.github/workflows/wiki-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki-sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v6

    - name: 📖 Wiki Integration Summary
      run: |
        echo "🚀 Wiki Integration Status"
        echo "========================="
        echo ""
        echo "📚 Primary Documentation: https://alteriom.github.io/EByte_LoRa_E220_Series_Library/"
        echo "📖 Community Wiki: https://github.com/Alteriom/EByte_LoRa_E220_Series_Library/wiki"
        echo ""
        echo "📋 Integration Strategy:"
        echo "  ✅ Modern documentation serves as primary resource"
        echo "  ✅ Wiki provides community-driven supplements"
        echo "  ✅ Clear cross-referencing between systems"
        echo "  ✅ Consistent user experience"
        echo ""
        echo "🔗 Key Features:"
        echo "  📱 Mobile-friendly modern docs"
        echo "  🔍 Live search functionality"
        echo "  🤝 Community wiki contributions"
        echo "  📚 Comprehensive cross-linking"
        echo ""
        echo "📊 Documentation Files:"
        echo "  📄 Main docs: $(find docs -name "*.md" | wc -l) files"
        echo "  🔧 Integration guide: docs/wiki-integration-guide.md"
        echo "  📋 Wiki templates: Available in integration guide"
        echo ""
        
    - name: 🔍 Validate Wiki Integration
      run: |
        echo "🔍 Validating wiki integration setup..."
        
        # Check if wiki integration guide exists
        if [ -f "docs/wiki-integration-guide.md" ]; then
          echo "✅ Wiki integration guide found"
        else
          echo "❌ Missing wiki integration guide"
          exit 1
        fi
        
        # Check for wiki references in main README
        if grep -q "wiki" README.md; then
          echo "✅ Wiki references found in README"
        else
          echo "⚠️ No wiki references in README"
        fi
        
        # Check documentation links
        if grep -q "alteriom.github.io" README.md; then
          echo "✅ Modern documentation links found"
        else
          echo "❌ Missing modern documentation links"
          exit 1
        fi
        
    - name: 📝 Generate Wiki Templates
      run: |
        echo "📝 Generating wiki page templates..."
        
        mkdir -p wiki-templates
        
        # Create Home page template
        cat > wiki-templates/Home.md << 'EOF'
        # Welcome to the Alteriom EByte LoRa E220 Wiki! 🚀

        ## 📚 **[VISIT OUR MODERN DOCUMENTATION →](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/)**

        **Our main documentation features:**
        - 📱 Mobile-friendly responsive design
        - 🔍 Live search functionality  
        - 💻 Copy-paste Arduino examples
        - 🎯 Platform-specific guides
        - ⚡ 5-minute quick start

        ---

        ## 🤝 Community Contributions

        This wiki contains community-driven content that supplements our main documentation:

        ### 📋 Wiki Sections

        - **[Community Guides](Community-Guides)** - User-contributed tutorials and tips
        - **[Troubleshooting FAQ](Community-FAQ)** - Community Q&A
        - **[Hardware Variants](Hardware-Variants)** - Different E220 module variations
        - **[Regional Setup](Regional-Setup)** - Country-specific configuration guides

        ### 🚀 Quick Links to Main Documentation

        | Resource | Link |
        |----------|------|
        | 🏠 **Main Docs** | [📚 Live Documentation](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/) |
        | ⚡ **Quick Start** | [🚀 5-Minute Setup](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/quickstart) |
        | 📖 **API Reference** | [🔧 Complete API](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/api-reference) |
        | 💻 **Examples** | [📋 Arduino Code](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/examples) |
        | ⚙️ **Configuration** | [🔧 Device Setup](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/configuration) |

        ---

        ## 🤝 Contributing to the Wiki

        1. **Check main docs first** - Ensure content isn't already covered
        2. **Focus on community content** - Share unique insights, projects, tips
        3. **Follow guidelines** - Keep consistent with project style
        4. **Link to main docs** - Reference official documentation when relevant

        ## 📞 Need Help?

        - **📚 Check main docs**: [alteriom.github.io/EByte_LoRa_E220_Series_Library/](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/)
        - **🐛 Report issues**: [GitHub Issues](https://github.com/Alteriom/EByte_LoRa_E220_Series_Library/issues)
        - **💬 Community discussions**: [GitHub Discussions](https://github.com/Alteriom/EByte_LoRa_E220_Series_Library/discussions)
        EOF
        
        # Create Community Guides template
        cat > wiki-templates/Community-Guides.md << 'EOF'
        # Community Guides

        User-contributed guides and tutorials that supplement the official documentation.

        ## 📋 Available Guides

        ### 🏗️ Project Tutorials
        - **LoRa Weather Station** - Complete weather monitoring system
        - **Remote Sensor Network** - Multi-node sensor deployment
        - **LoRa GPS Tracker** - Location tracking with E220 modules

        ### 🔧 Advanced Configuration
        - **Custom Antenna Designs** - Improving range with DIY antennas  
        - **Mesh Networking** - Creating LoRa mesh networks
        - **Power Optimization** - Battery life optimization techniques

        ### 🌍 Regional Setups
        - **European Deployment** - EU frequency regulations and setup
        - **US Deployment** - FCC compliance and configuration
        - **Asian Markets** - Region-specific considerations

        ## 🤝 Contributing a Guide

        1. **Create a new wiki page**
        2. **Follow the template below**
        3. **Link back to official docs**
        4. **Update this index page**

        ### Guide Template

        ```markdown
        # Guide Title

        ## Overview
        Brief description of what this guide covers.

        ## Prerequisites
        - Link to [official setup guide](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/quickstart)
        - Required hardware/software

        ## Step-by-Step Instructions
        Detailed instructions with code examples.

        ## Troubleshooting
        Common issues specific to this guide.

        ## Related Documentation
        - [Official API Reference](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/api-reference)
        - Other relevant wiki pages
        ```

        ## 📚 Official Documentation

        For complete documentation, visit: [📚 Modern Documentation Site](https://alteriom.github.io/EByte_LoRa_E220_Series_Library/)
        EOF
        
        echo "✅ Wiki templates generated in wiki-templates/ directory"
        
    - name: 📊 Wiki Integration Report
      run: |
        echo "📊 Wiki Integration Report"
        echo "========================="
        echo ""
        echo "✅ **Integration Complete!**"
        echo ""
        echo "🎯 **What's Ready:**"
        echo "  📚 Modern documentation system deployed"
        echo "  📖 Wiki integration guide created"
        echo "  📝 Wiki page templates generated"
        echo "  🔗 Cross-references established"
        echo "  📱 Mobile-friendly experience"
        echo ""
        echo "🚀 **Next Steps:**"
        echo "  1. Copy templates from wiki-templates/ to GitHub Wiki"
        echo "  2. Configure wiki sidebar with provided navigation"
        echo "  3. Promote community contributions to wiki"
        echo "  4. Monitor and maintain both documentation systems"
        echo ""
        echo "📈 **Benefits:**"
        echo "  ✅ Professional modern documentation"
        echo "  ✅ Community-driven wiki content"
        echo "  ✅ Clear hierarchy and navigation"
        echo "  ✅ Consistent user experience"
        echo "  ✅ Reduced maintenance overhead"
        echo ""
        echo "🔗 **Access Points:**"
        echo "  📚 Main Docs: https://alteriom.github.io/EByte_LoRa_E220_Series_Library/"
        echo "  📖 Wiki: https://github.com/Alteriom/EByte_LoRa_E220_Series_Library/wiki"
        echo "  📋 Templates: Available in build artifacts"
        echo ""
        
    - name: 📦 Archive Wiki Templates
      uses: actions/upload-artifact@v7
      with:
        name: wiki-templates
        path: wiki-templates/
        retention-days: 90

    - name: 🎉 Success Summary
      run: |
        echo "🎉 Wiki Integration Workflow Complete!"
        echo ""
        echo "Your documentation system is now ready with:"
        echo ""
        echo "📚 **Modern Documentation**"
        echo "  ✅ Beautiful responsive design"
        echo "  ✅ Live search functionality"
        echo "  ✅ Interactive examples"
        echo "  ✅ Mobile optimization"
        echo ""
        echo "📖 **Community Wiki**"
        echo "  ✅ Ready-to-use templates"
        echo "  ✅ Clear integration strategy"
        echo "  ✅ Community contribution guidelines"
        echo "  ✅ Cross-reference system"
        echo ""
        echo "🔗 **Perfect Integration**"
        echo "  📱 Users get modern docs by default"
        echo "  🤝 Community can contribute via wiki"
        echo "  📚 Both systems work together seamlessly"
        echo "  ⚡ Maintenance is streamlined"
        echo ""
        echo "Ready to serve your users! 🚀"