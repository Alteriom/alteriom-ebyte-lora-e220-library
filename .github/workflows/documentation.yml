name: 📚 Modern Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-modern-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: 🔍 Setup documentation structure
      run: |
        echo "🏗️ Setting up modern documentation with Docsify..."
        
        # Ensure docs directory exists
        mkdir -p docs
        
        # Copy README to docs if it doesn't exist there
        if [ ! -f docs/README.md ]; then
          cp README.md docs/README.md
        fi
        
        # Create .nojekyll for GitHub Pages
        touch docs/.nojekyll
        
        # List documentation files
        echo "📁 Documentation files:"
        find docs -name "*.md" -o -name "*.html" | head -20
        
    - name: 🎨 Validate Docsify setup
      run: |
        echo "✅ Checking Docsify configuration..."
        
        # Check if index.html exists
        if [ -f docs/index.html ]; then
          echo "✅ Docsify index.html found"
        else
          echo "❌ Missing docs/index.html"
          exit 1
        fi
        
        # Check sidebar
        if [ -f docs/_sidebar.md ]; then
          echo "✅ Sidebar configuration found"
        else
          echo "⚠️ No sidebar found - will use auto-generated"
        fi
        
        # Check navbar
        if [ -f docs/_navbar.md ]; then
          echo "✅ Navbar configuration found"
        else
          echo "⚠️ No navbar found - will use default"
        fi
        
    - name: 📊 Generate documentation metrics
      run: |
        echo "📊 Documentation Statistics"
        echo "=========================="
        
        # Count documentation files
        MD_COUNT=$(find docs -name "*.md" | wc -l)
        EXAMPLE_COUNT=$(find examples -name "*.ino" 2>/dev/null | wc -l || echo "0")
        
        echo "📄 Markdown files: $MD_COUNT"
        echo "💻 Arduino examples: $EXAMPLE_COUNT"
        echo "📁 Total documentation size:"
        du -sh docs/ || echo "Could not calculate size"
        
        # Create metrics file for the site
        cat > docs/metrics.md << EOF
        # 📊 Documentation Metrics
        
        - **📄 Documentation Pages**: $MD_COUNT
        - **💻 Arduino Examples**: $EXAMPLE_COUNT  
        - **🔄 Last Updated**: $(date '+%Y-%m-%d %H:%M:%S UTC')
        - **📦 Library Version**: $(grep 'version=' library.properties | cut -d'=' -f2)
        - **🏗️ Build**: #${{ github.run_number }}
        
        This documentation is automatically generated and deployed.
        EOF
        
    - name: 🔧 Setup GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v5
      
    - name: 📤 Upload documentation to Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./docs
        
    - name: 📦 Archive documentation artifacts
      uses: actions/upload-artifact@v7
      with:
        name: modern-documentation
        path: docs/
        retention-days: 30
        
    - name: ✅ Documentation build summary
      run: |
        echo "================================"
        echo "🎉 Modern Documentation Built!"
        echo "================================"
        echo ""
        echo "🌟 Features:"
        echo "  ✅ Beautiful responsive design with Docsify"
        echo "  ✅ Live search functionality"
        echo "  ✅ Mobile-friendly interface"
        echo "  ✅ Code syntax highlighting"
        echo "  ✅ Tabbed content support"
        echo "  ✅ Copy-to-clipboard for code"
        echo "  ✅ Progress bar navigation"
        echo "  ✅ Arduino-style code blocks"
        echo ""
        echo "🔗 Access Methods:"
        echo "  📱 GitHub Pages: https://alteriom.github.io/EByte_LoRa_E220_Series_Library/"
        echo "  📁 Repository: https://github.com/Alteriom/EByte_LoRa_E220_Series_Library/tree/main/docs"
        echo ""
        echo "📊 Statistics:"
        echo "  📄 Pages: $(find docs -name "*.md" | wc -l)"
        echo "  💻 Examples: $(find examples -name "*.ino" 2>/dev/null | wc -l || echo "0")"
        echo "================================"

  deploy-docs:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-modern-docs
    
    steps:
    - name: 🚀 Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  validate-links:
    runs-on: ubuntu-latest
    needs: build-modern-docs
    continue-on-error: true
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v6
      
    - name: 📥 Download documentation
      uses: actions/download-artifact@v7
      with:
        name: modern-documentation
        path: docs/
        
    - name: 🔗 Validate internal links
      run: |
        echo "🔍 Validating documentation links..."
        
        # Simple link validation for markdown files
        for file in $(find docs -name "*.md"); do
          echo "Checking $file..."
          
          # Check for broken internal links (basic check)
          grep -oE '\]\([^)]+\.md\)' "$file" | while read link; do
            target=$(echo "$link" | sed 's/.*(\([^)]*\)).*/\1/')
            if [[ "$target" == *".md" ]] && [[ ! -f "docs/$target" ]] && [[ ! -f "$target" ]]; then
              echo "⚠️ Potential broken link in $file: $target"
            fi
          done
        done
        
        echo "✅ Link validation completed"